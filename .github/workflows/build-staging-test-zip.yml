name: Build staging test ZIP

run-name: Build staging test ZIP (${{ github.ref_name }})

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'assets/**'
      - 'includes/**'
      - 'tests/**'
      - 'vendor/**'
      - 'composer.json'
      - 'readme.txt'
      - 'LICENSE'
      - 'wpessential-order-rescue-hub-woocommerce.php'
      - '.github/workflows/build-staging-test-zip.yml'

permissions:
  contents: read

jobs:
  package:
    name: Build and verify installable ZIP
    runs-on: ubuntu-24.04
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: wperh_test
          MYSQL_USER: wperh
          MYSQL_PASSWORD: wperh_test_password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -p$MYSQL_ROOT_PASSWORD"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Stamp unique build identity
        shell: bash
        run: |
          cat > build-info.php <<'PHP'
          <?php
          return array(
              'id' => 'build-${{ github.run_number }}-${{ github.run_attempt }}',
              'commit' => '${{ github.sha }}',
          );
          PHP

      - name: Set up PHP 8.3
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mysqli, pdo_mysql
          coverage: none

      - name: Lint plugin PHP sources
        shell: bash
        run: |
          php --version
          while IFS= read -r -d '' file; do
            php -l "$file"
          done < <(find includes vendor -type f -name '*.php' -print0)
          php -l wpessential-order-rescue-hub-woocommerce.php
          php -l build-info.php

      - name: Run database-backed schema migration test
        env:
          WPERH_WORDPRESS_ROOT: /tmp/wperh-wordpress/wordpress
          WPERH_DB_NAME: wperh_test
          WPERH_DB_USER: wperh
          WPERH_DB_PASSWORD: wperh_test_password
          WPERH_DB_HOST: 127.0.0.1
        run: |
          mkdir -p /tmp/wperh-wordpress
          curl --fail --silent --show-error --location https://wordpress.org/wordpress-7.1.4.zip --output /tmp/wperh-wordpress.zip
          unzip -q /tmp/wperh-wordpress.zip -d /tmp/wperh-wordpress
          php tests/InstallerDatabaseIntegrationTest.php

      - name: Run detector behavior smoke tests
        run: php tests/DetectorSmokeTest.php

      - name: Run schema installer smoke tests
        run: php tests/InstallerSmokeTest.php

      - name: Run case service validation smoke tests
        run: php tests/CaseServiceSmokeTest.php

      - name: Run Pro settings validation smoke tests
        run: php tests/ProSettingsSmokeTest.php

      - name: Run Pro alert retry smoke tests
        run: php tests/ProAlertSmokeTest.php

      - name: Set up PHP 8.4
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none

      - name: Lint and run smoke tests on PHP 8.4
        shell: bash
        run: |
          php --version
          while IFS= read -r -d '' file; do php -l "$file"; done < <(find includes vendor tests -type f -name '*.php' -print0)
          php -l wpessential-order-rescue-hub-woocommerce.php
          php tests/DetectorSmokeTest.php
          php tests/InstallerSmokeTest.php
          php tests/CaseServiceSmokeTest.php

      - name: Set up PHP 8.5
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          coverage: none

      - name: Lint and run smoke tests on PHP 8.5
        shell: bash
        run: |
          php --version
          while IFS= read -r -d '' file; do php -l "$file"; done < <(find includes vendor tests -type f -name '*.php' -print0)
          php -l wpessential-order-rescue-hub-woocommerce.php
          php tests/DetectorSmokeTest.php
          php tests/InstallerSmokeTest.php
          php tests/CaseServiceSmokeTest.php

      - name: Assemble and verify the WordPress plugin package
        run: |
          python3 - <<'PY'
          import json
          import re
          from pathlib import Path
          from zipfile import ZIP_DEFLATED, ZipFile, ZipInfo

          root = Path.cwd()
          plugin_slug = "wpessential-order-rescue-hub-woocommerce"
          package_root = Path("dist")
          package_root.mkdir(exist_ok=True)
          zip_path = package_root / f"{plugin_slug}.zip"

          required = [
              Path("LICENSE"),
              Path("readme.txt"),
              Path("composer.json"),
              Path(f"{plugin_slug}.php"),
              Path("build-info.php"),
              Path("vendor/autoload.php"),
              Path("vendor/composer/ClassLoader.php"),
              Path("vendor/composer/LICENSE"),
              Path("vendor/composer/autoload_psr4.php"),
              Path("vendor/composer/autoload_real.php"),
          ]
          missing = [str(path) for path in required if not (root / path).is_file()]
          if missing:
              raise SystemExit("Required package files are missing: " + ", ".join(missing))

          build_info = (root / "build-info.php").read_text(encoding="utf-8")
          if "build-${{ github.run_number }}-${{ github.run_attempt }}" not in build_info:
              raise SystemExit("Unique workflow build identity was not stamped into the package.")
          if "${{ github.sha }}" not in build_info:
              raise SystemExit("Source commit SHA is missing from the package build identity.")

          composer = json.loads((root / "composer.json").read_text(encoding="utf-8"))
          psr4 = composer.get("autoload", {}).get("psr-4", {})
          if psr4.get("WPEssential\\OrderRescueHub\\") != "includes/":
              raise SystemExit("Composer PSR-4 mapping is missing or incorrect.")

          sources = list(required)
          for directory in (Path("assets"), Path("includes")):
              sources.extend(sorted(path.relative_to(root) for path in (root / directory).rglob("*") if path.is_file()))

          autoload_source = (root / "vendor/composer/autoload_real.php").read_text(encoding="utf-8")
          if "class_exists" not in autoload_source:
              raise SystemExit("Composer collision guard is absent from autoload_real.php.")

          php_files = [root / path for path in sources if path.suffix == ".php"]
          plugin_headers = sum(
              len(re.findall(r"^\s*\*?\s*Plugin Name:", path.read_text(encoding="utf-8"), re.MULTILINE))
              for path in php_files
          )
          if plugin_headers != 1:
              raise SystemExit(f"Expected one plugin header, found {plugin_headers}.")

          timestamp = (2020, 1, 1, 0, 0, 0)
          with ZipFile(zip_path, "w", compression=ZIP_DEFLATED, compresslevel=9) as archive:
              for path in sorted(set(sources), key=lambda item: item.as_posix()):
                  info = ZipInfo(f"{plugin_slug}/{path.as_posix()}", date_time=timestamp)
                  info.compress_type = ZIP_DEFLATED
                  info.external_attr = 0o100644 << 16
                  archive.writestr(info, (root / path).read_bytes())

          with ZipFile(zip_path) as archive:
              corrupt = archive.testzip()
              names = archive.namelist()
              if corrupt:
                  raise SystemExit(f"ZIP integrity check failed at {corrupt}.")
              if not names or any(not name.startswith(f"{plugin_slug}/") for name in names):
                  raise SystemExit("ZIP must contain one canonical plugin root folder.")
              if len(names) != len(set(names)):
                  raise SystemExit("ZIP contains duplicate paths.")

          print(f"Created {zip_path} with {len(names)} files ({zip_path.stat().st_size} bytes).")
          PY

      - name: Upload installable ZIP artifact
        uses: actions/upload-artifact@v4
        with:
          name: wperh-staging-test-${{ github.run_number }}-${{ github.run_attempt }}-${{ github.sha }}
          path: dist/wpessential-order-rescue-hub-woocommerce.zip
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
